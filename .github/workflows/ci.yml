name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify selection rules
        run: |
          node --test tools/affected-tests.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Selection regressions failed' }
          ./tools/Test-AffectedRunner.ps1
      # Test GitHub's PR merge tree. Keep the required job for docs-only PRs;
      # protected main does not need a duplicate post-merge run of the same tree.
      - name: Verify affected code (manual runs verify everything)
        shell: pwsh
        env:
          AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $verification = @{ CommittedOnly = $true; LogDir = '${{ runner.temp }}/affected-results' }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $verification.Full = $true }
          else { $verification.Base = $env:AFFECTED_BASE }
          ./tools/Invoke-AffectedTests.ps1 @verification
      - name: Retain selection and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affected-results
          path: ${{ runner.temp }}/affected-results
